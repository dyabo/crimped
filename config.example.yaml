# climbro — example config (v1)
# This is what the CLI wizard produces, and what you can hand-edit instead.
# Grades are written in your chosen display scale; internally they normalize to V.
# Weights are in `units` (kg or lb). Everything else: see comments.

profile:
  name: Bo                 # optional, only personalizes the file
  sex: male                # male | female  (required: strength norms differ)
  age: 30                  # optional
  units: kg                # kg | lb
  bodyweight: 83           # current bodyweight, in `units`

climbing:
  grade_scale: V           # V | Font  (display only; engine uses V internally)
  current_grade: V5        # consistent hardest grade (not a one-off send)
  target_grade: V8         # must be at or above current
  years_climbing: 1        # influences technique-vs-strength emphasis
  max_hang_added: 15       # optional: added kg on a 20 mm edge, 7 s hang
  max_pullup_added: 20     # optional: added kg on a weighted pull-up

goal:
  goal: competition        # send_grade | competition   (only these two in v1)
  start_date: 2026-06-08   # blank/omit = today
  goal_date: 2026-12-28    # competition date, or "by when"

weight:                    # OPTIONAL cut block
  enabled: true            # false -> no deficit phase, no weight curve
  target_bodyweight: 78    # required if enabled; in `units`
  max_rate_pct: 0.7        # cap on weekly loss as % of bodyweight (engine clamps)

availability:
  days_per_week: 6         # 2..7  (drives how many sessions get scheduled)
  available_days: [Mon, Tue, Wed, Thu, Sat, Sun]   # optional; length must == days_per_week

equipment:
  has_fingerboard: true    # false -> finger work redirected to the wall
  has_system_board: true   # MoonBoard / Kilter / Tension
  has_gym: true            # false -> strength uses bodyweight/board alternatives
  wearable: garmin         # garmin (HRV+RHR+Body Battery) | other (HRV+RHR) | none

options:
  include_mobility: true   # adds the mobility protocol + measurements sheet
  include_lead: false      # mix one lead/rope session per week into the plan
  include_nutrition: true  # nutrition calculator sheet (useful even without a cut)
  output_path: null        # where to write the .xlsx (null = default)
