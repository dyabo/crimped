[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crimped"
version = "0.1.1"
description = "Generator of a personalized climbing training tracker (xlsx): periodized plan, day-by-day schedule, sRPE/ACWR analytics, finger-strength norms."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bo (Bogdan Dyachok)"}]
dependencies = ["openpyxl>=3.1", "PyYAML>=6.0"]

[project.scripts]
crimped = "crimped.cli:main"

[tool.setuptools]
packages = ["crimped", "crimped.render"]
